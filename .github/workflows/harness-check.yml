name: harness-check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: harness-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  harness-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sandbox full check
        run: docker compose run --rm -e BRANCH_NAME checks npm run check

      - name: Upload golden-boot artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-boot
          path: artifacts/golden-boot.png
          if-no-files-found: warn

      - name: Tear down sandbox
        if: always()
        run: docker compose down --volumes --remove-orphans
