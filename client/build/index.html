<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Q-Game</title>
  </head>
  <body>
    <main>
      <h1>Q-Game</h1>
      <p>Client bundle is being served by Fastify.</p>
      <canvas id="qgame-canvas" width="960" height="540" aria-label="Q-Game scene"></canvas>
      <section aria-label="Interactables">
        <h2>Interactables</h2>
        <ul id="qgame-interactables"></ul>
      </section>
      <section aria-label="Casebook">
        <h2>Casebook</h2>
        <button id="qgame-casebook-toggle" type="button" aria-controls="qgame-casebook" aria-expanded="false">
          Toggle casebook
        </button>
        <div id="qgame-casebook" hidden>
          <ul id="qgame-casebook-clues"></ul>
        </div>
      </section>
    </main>
    <script type="module" src="/client.boot.js"></script>
  </body>
</html>
